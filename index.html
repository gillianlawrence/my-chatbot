<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <!-- The cute cookie mascot -->
        <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <mask id="bite">
              <rect width="64" height="64" fill="#fff"/>
              <circle cx="52" cy="14" r="8"/>
              <circle cx="45" cy="9" r="6"/>
              <circle cx="56" cy="24" r="6"/>
            </mask>
          </defs>
          <g mask="url(#bite)">
            <circle cx="32" cy="34" r="25" fill="#fff1dc" stroke="#e8c9a0" stroke-width="2"/>
            <circle cx="18" cy="24" r="2.6" fill="#8a5a44"/>
            <circle cx="26" cy="47" r="2.4" fill="#8a5a44"/>
            <circle cx="47" cy="43" r="2.6" fill="#8a5a44"/>
          </g>
          <circle cx="25" cy="33" r="3" fill="#3b2a2f"/>
          <circle cx="39" cy="33" r="3" fill="#3b2a2f"/>
          <circle cx="26" cy="32" r="1" fill="#fff"/>
          <circle cx="40" cy="32" r="1" fill="#fff"/>
          <ellipse cx="20" cy="40" rx="4" ry="2.6" fill="#ff9db8"/>
          <ellipse cx="44" cy="40" rx="4" ry="2.6" fill="#ff9db8"/>
          <path d="M27 40 Q32 46 37 40" fill="none" stroke="#3b2a2f" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="brand-emoji" id="botEmoji"></span>
        <div>
          <h1 id="botName"></h1>
          <p id="botTagline"></p>
        </div>
      </div>
      <div class="header-buttons">
        <button id="keyBtn" class="btn btn-ghost" type="button">API key</button>
        <button id="newChatBtn" class="btn btn-ghost" type="button">New chat</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="starters" class="starters"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type a message..." aria-label="Message"></textarea>
      <button id="sendBtn" class="btn btn-primary" type="button">Send</button>
    </div>
  </div>

  <!-- API key pop-up -->
  <div id="keyModal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
      <h2 id="keyTitle">Your Gemini API key</h2>
      <p class="modal-text">
        Paste your key below. It is never saved in the website's code.
        Get a free key at
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
      </p>
      <input id="keyInput" type="password" placeholder="Paste your API key here" autocomplete="off" />
      <label class="remember">
        <input id="rememberBox" type="checkbox" />
        Remember on this device
      </label>
      <div class="modal-buttons">
        <button id="keyCancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="keySave" class="btn btn-primary" type="button">Save key</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
